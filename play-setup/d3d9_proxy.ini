[Proxy]
; Set to 1 and restart via 'Play Blacklist with Remix' to record per-frame timing, call timing,
; and GPU telemetry files (rtx_telemetry.jsonl and d3d9_proxy_*.csv) when debugging. 0 = off for normal play.
; Edit D:\BlacklistOverhaul\tools\remix\play-setup\d3d9_proxy.ini (copied to Steam on launch).
EnableDebuggingTelemetry=0
; Lights: StandInSkipUnplaced defaults to 1, so no stand-in glow balls on lens flares the game never placed
; (15 of them sit at the world origin in American Consumption). To bring them back, add
; [Lights] with StandInSkipUnplaced=0.
