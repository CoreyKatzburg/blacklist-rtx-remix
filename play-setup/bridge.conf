# Splinter Cell Blacklist RTX Remix Bridge configuration.
disableTimeouts = False
# Lets Alt+Home reach Remix even though the game reads the keyboard through DirectInput.
client.DirectInput.forward.keyboardPolicy = 3

sendCreateFunctionServerResponses = False
exposeRemixApi = True

# Cap frame queue to 1 frame (eliminates 3-frame / ~60 ms input lag and ring-buffer backlog).
presentSemaphoreMaxFrames = 1

# Route dynamic vertex/index buffer locks through a 64 MB SharedHeap segment (fits 32-bit VA space)
# so Unlock() becomes a non-blocking pointer handoff instead of stalling on the 32 MB command ring.
useSharedHeap = True
sharedHeapPolicy = DynamicBuffers
sharedHeapDefaultSegmentSize = 67108864

clientCmdQueueSize = 32768
clientDataQueueSize = 32768
eliminateRedundantSetterCalls = True
