# Splinter Cell Blacklist RTX Remix configuration (single source of truth).
# Static Remix options belong ONLY in this file; never duplicate them in d3d9_proxy.ini.

# Startup and menu
# Ray tracing starts False because title/loading screens have no 3D camera; lightpub AutoRaytracing switches it True in missions.
rtx.enableRaytracing = False
rtx.enableVsync = 0
rtx.remixMenuKeyBinds = ALT, HOME
rtx.useVertexCapture = True
rtx.zUp = True
rtx.useWhiteMaterialMode = False
rtx.ignoreAllVertexColorBakedLighting = True

# Keep off-screen walls and lampshades alive across camera turns so outside light never leaks in from behind the camera.
rtx.antiCulling.object.enable = True

# Fallback light: 1 = active only when zero game lights are published
rtx.fallbackLightMode = 1
rtx.fallbackLightType = 1
rtx.fallbackLightRadius = 5.0
rtx.fallbackLightRadiance = 100, 100, 100

# Hide legacy glow/beam sprite textures that PassFilter allows into world passes
rtx.ignoreTextures = 0x3983E60696D3B6B2, 0x9FC3EB02C04CDCFF

# Pre-loaded game-wide decal diffuse hashes (bullet holes, blood, signs, scorches) exported offline by build_materials.py
