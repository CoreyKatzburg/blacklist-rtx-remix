# Explicit Custom presets so Remix never silently overrides settings to Low (853x480) on 8 GB GPUs.
# qualityDLSS: 0 = UltraPerf (853x480), 1 = MaxPerf/Performance (1280x720 at 1440p), 2 = Balanced (1485x835), 3 = Quality (1707x960).
# rayreconstruction.model: 0 = CNN, 1 = Transformer (sharper angled detail and edges).
rtx.graphicsPreset = 4
rtx.dlssPreset = 2
rtx.upscalerType = 1
rtx.enableRayReconstruction = True
rtx.qualityDLSS = 3
rtx.rayreconstruction.model = 1
rtx.isReflexEnabled = True
rtx.reflexMode = 1

# Path tracing and Neural Radiance Cache (lowMemoryGpu = False loads sharpest 2048x2048 normal/roughness mips).
rtx.lowMemoryGpu = False
rtx.pathMinBounces = 0
rtx.pathMaxBounces = 2
rtx.russianRouletteMaxContinueProbability = 0.7
rtx.russianRoulette1stBounceMinContinueProbability = 0.4
# NRC Medium: the preset itself sets 2 training iterations and 6 training bounces.
rtx.neuralRadianceCache.qualityPreset = 0
rtx.denoiseDirectAndIndirectLightingSeparately = False
rtx.enableUnorderedResolveInIndirectRays = False
rtx.enableTransmissionApproximationInIndirectRays = True
rtx.di.enableRayTracedBiasCorrection = False
rtx.enableStochasticAlphaBlend = False

# Physical volumetric lighting (froxelGridResolutionScale = 8 doubles fog grid resolution for crisp weapon flashlight beams).
rtx.volumetrics.enable = True
rtx.volumetrics.froxelGridResolutionScale = 8
rtx.volumetrics.froxelDepthSlices = 48
rtx.volumetrics.transmittanceColor = 0.93, 0.93, 0.93
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 15
rtx.volumetrics.singleScatteringAlbedo = 0.97, 0.97, 0.97
rtx.volumetrics.anisotropy = 0.3

# Tone mapping: Remix's modern ACES/auto-exposure tonemapper runs by default ([Proxy] ModernFilter=1),
# handing off right before Blacklist composites soft particles and coronas on top.
