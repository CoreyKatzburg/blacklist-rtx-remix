\* device.cfg with finding F1 fixed in the model only (SyncMatchesRollover), to show finding F3 behind it.
SPECIFICATION Spec
CONSTANTS
  N = 10
  MaxPayload = 2
  MaxItems = 3
  MaxCmdSlots = 4
  MaxQueued = 3
  MaxStaged = 2
  WriterMayWait = TRUE
  ReaderPublishes = TRUE
  StageSetters = TRUE
  FlushBeforeWait = TRUE
  UidFirst = TRUE
  SyncMatchesRollover = TRUE
  RequestResponse = FALSE
  HandshakeFirst = TRUE
INVARIANTS NoFreeze NoOverwrite InSync NoFatal
