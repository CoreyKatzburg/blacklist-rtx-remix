\* BROKEN ON PURPOSE: replies without the request/response rule (the writer does not wait and laps the reader).
SPECIFICATION Spec
CONSTANTS
  N = 10
  MaxPayload = 2
  MaxItems = 3
  MaxCmdSlots = 4
  MaxQueued = 3
  MaxStaged = 2
  WriterMayWait = FALSE
  ReaderPublishes = FALSE
  StageSetters = FALSE
  FlushBeforeWait = TRUE
  UidFirst = FALSE
  SyncMatchesRollover = FALSE
  RequestResponse = FALSE
  HandshakeFirst = FALSE
INVARIANTS NoFreeze NoOverwrite InSync NoFatal
