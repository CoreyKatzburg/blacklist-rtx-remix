\* BROKEN ON PURPOSE: the reply writer waits for a reader that never publishes (the 2026-11-12 freeze).
SPECIFICATION Spec
CONSTANTS
  N = 10
  MaxPayload = 2
  MaxItems = 3
  MaxCmdSlots = 4
  MaxQueued = 3
  MaxStaged = 2
  WriterMayWait = TRUE
  ReaderPublishes = FALSE
  StageSetters = FALSE
  FlushBeforeWait = TRUE
  UidFirst = FALSE
  SyncMatchesRollover = FALSE
  RequestResponse = TRUE
  HandshakeFirst = FALSE
INVARIANTS NoFreeze NoOverwrite InSync NoFatal
